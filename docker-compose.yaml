services:
  debezium-connect:
    image: quay.io/debezium/connect:3.3
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka1:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: "true"
      # Cho phép Kafka Connect tự tạo các topic nếu chưa có
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      EXACTLY_ONCE_SOURCE_SUPPORT: "enabled"
#    depends_on:
#      - kafka1
#      - db
    restart: unless-stopped
    volumes:
      - debezium-connect:/kafka/connect
      - debezium-config:/kafka/config
      - debezium-data:/kafka/data
      - debezium-logs:/kafka/logs

volumes:
  debezium-connect:
  debezium-config:
  debezium-data:
  debezium-logs: